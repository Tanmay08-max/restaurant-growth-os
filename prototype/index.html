.auth-screen{min-height:100vh;display:grid;grid-template-columns:1fr 1fr;background:#fff}.auth-art{padding:60px;display:flex;flex-direction:column;justify-content:space-between;background:radial-gradient(circle at 10% 10%,#e4ecff,transparent 45%),linear-gradient(140deg,#f6f8ff,#edf4ff);position:relative;overflow:hidden}.auth-art h1{font-size:42px;line-height:1.12;max-width:520px}.auth-art p{font-size:16px;color:#65738b;max-width:460px}.auth-statrow{display:flex;gap:24px;margin-top:35px}.auth-stat strong{font-size:23px;display:block}.auth-stat span{font-size:12px;color:var(--muted)}.auth-main{display:flex;align-items:center;justify-content:center;padding:40px 22px}.auth-box{width:min(440px,100%)}.auth-box h2{font-size:27px;margin-bottom:5px}.auth-box>p{color:var(--muted);margin-bottom:25px}.stepdots{display:flex;gap:6px;margin-bottom:22px}.stepdots span{height:4px;flex:1;background:#e7ebf3;border-radius:9px}.stepdots span.on{background:var(--primary)}.plan-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:13px}.plan-card{border:1px solid var(--line);border-radius:14px;padding:17px;background:#fff;display:flex;flex-direction:column;gap:10px}.plan-card.selected{border:2px solid var(--primary);padding:16px;box-shadow:0 0 0 4px #3267e90e}.plan-price{font-size:28px;font-weight:850;letter-spacing:-1px}.plan-price small{font-size:11px;color:var(--muted);font-weight:600;letter-spacing:0}.plan-card ul{padding-left:17px;color:#637086;font-size:12px;line-height:1.9;flex:1}.recommended{font-size:10px;color:var(--primary);font-weight:850;letter-spacing:.7px}
.overlay{position:fixed;inset:0;background:#17203366;display:flex;align-items:center;justify-content:center;padding:20px;z-index:100}.modal{width:min(620px,100%);max-height:90vh;overflow:auto;background:#fff;border-radius:17px;padding:23px;box-shadow:0 20px 70px #15244433}.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:17px}.modal-head h2{margin:0}.close{border:0;background:#f0f3f8;border-radius:8px;width:31px;height:31px;font-size:18px}
.toast-wrap{position:fixed;right:22px;top:82px;z-index:200;display:flex;flex-direction:column;gap:8px}.toast{background:#18243a;color:white;border-radius:10px;padding:12px 15px;box-shadow:var(--shadow);max-width:340px;font-size:12px}.toast.ok{background:#126a4a}.toast.err{background:#a62d3d}
.pos-layout{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(320px,.8fr);gap:16px;align-items:start}.menu-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.product-card{border:1px solid var(--line);border-radius:12px;padding:13px;background:#fff;display:flex;flex-direction:column;gap:8px;min-height:150px}.product-emoji{height:58px;background:#f5f7fb;border-radius:9px;display:grid;place-items:center;font-size:29px}.product-card .btn{margin-top:auto}.cart-line{display:flex;gap:10px;align-items:center;padding:11px 0;border-bottom:1px solid #edf0f5}.qty{display:flex;align-items:center;gap:7px;margin-left:auto}.qty button{border:1px solid var(--line);background:#fff;border-radius:6px;width:25px;height:25px}.totals{display:flex;justify-content:space-between;padding:7px 0;font-size:12px}.totals.total{border-top:1px solid var(--line);font-weight:850;font-size:16px;margin-top:7px;padding-top:13px}
.insight{display:flex;gap:13px;padding:15px;border:1px solid var(--line);border-radius:12px;margin-bottom:11px}.insight-icon{width:38px;height:38px;flex-shrink:0;border-radius:11px;display:grid;place-items:center;background:var(--amberbg);font-size:18px}.insight p{margin:5px 0 10px;color:var(--muted);font-size:12px}.progress{height:7px;background:#edf1f7;border-radius:8px;overflow:hidden}.progress span{display:block;height:100%;background:var(--primary)}
.timeline{display:flex;flex-direction:column;gap:10px}.timeline-item{display:flex;gap:10px;align-items:flex-start}.timeline-dot{width:9px;height:9px;background:var(--primary);border-radius:50%;margin-top:5px;flex-shrink:0}.notice{padding:12px 14px;border-radius:10px;background:var(--soft);color:#3158ad;font-size:12px;margin-bottom:14px}.notice.warn{background:var(--amberbg);color:var(--amber)}.notice.success{background:var(--greenbg);color:var(--green)}
.mobile-menu{display:none}
@media(max-width:1150px){.sidebar{width:215px}.main{margin-left:215px}.content{padding:23px 20px}.topbar{padding:0 20px}.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.two{grid-template-columns:1fr}.menu-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:780px){.sidebar{transform:translateX(-100%);transition:transform .2s;width:260px}.sidebar.open{transform:translateX(0)}.main{margin-left:0}.mobile-menu{display:inline-flex}.topbar{padding:0 14px;height:62px}.content{padding:20px 13px}.page-head{flex-direction:column}.auth-screen{grid-template-columns:1fr}.auth-art{display:none}.auth-main{min-height:100vh}.plan-grid{grid-template-columns:1fr}.pos-layout{grid-template-columns:1fr}.kpis{gap:10px}.kpi-value{font-size:22px}.card{padding:14px}.form-grid{grid-template-columns:1fr}.form-grid .full{grid-column:auto}.menu-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.filters .search{width:100%}.outlet-select{max-width:130px}.top-actions{gap:6px}}
</style>

<body>
<div id="app"></div>
<div id="modal-root"></div><div id="toast-root" class="toast-wrap"></div>
<script>
(() => {
'use strict';
const $ = (s, r=document) => r.querySelector(s);
const $$ = (s, r=document) => [...r.querySelectorAll(s)];
const money = n => new Intl.NumberFormat('en-IN',{style:'currency',currency:'INR',maximumFractionDigits:0}).format(Number(n||0));
const dateFmt = d => new Date(d).toLocaleDateString('en-IN',{day:'2-digit',month:'short',year:'numeric'});
const today = () => new Date().toISOString().slice(0,10);
const esc = s => String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = p => p+'-'+Math.random().toString(36).slice(2,8).toUpperCase();
const state = {page:'login',user:null,selectedPlan:'Growth',outlet:'all',cart:[],menuFilter:'All',orderSearch:'',orderFilter:'All',reportRange:'7',adminMode:false};
const demoMenu = [
{id:'M001',name:'Classic Burger',category:'Mains',price:249,emoji:'🍔',available:true},
{id:'M002',name:'Margherita Pizza',category:'Mains',price:349,emoji:'🍕',available:true},
{id:'M003',name:'Masala Fries',category:'Sides',price:129,emoji:'🍟',available:true},
{id:'M004',name:'Cold Coffee',category:'Beverages',price:149,emoji:'🥤',available:true},
{id:'M005',name:'Paneer Tikka Wrap',category:'Mains',price:229,emoji:'🌯',available:true},
{id:'M006',name:'Chocolate Brownie',category:'Desserts',price:179,emoji:'🍰',available:true},
{id:'M007',name:'Lemon Soda',category:'Beverages',price:89,emoji:'🍋',available:true},
{id:'M008',name:'Garden Salad',category:'Sides',price:169,emoji:'🥗',available:true}
];
const seed = () => ({
users:[{id:'U001',name:'Demo Owner',email:'owner@demo.com',password:'Demo123!',role:'owner',verified:true,tenantId:'T001'}],
tenants:[{id:'T001',name:'The Urban Fork',city:'Lucknow',plan:'Growth',status:'Active',createdAt:today()}],
outlets:[{id:'O001',tenantId:'T001',name:'Hazratganj',city:'Lucknow',status:'Active'},{id:'O002',tenantId:'T001',name:'Gomti Nagar',city:'Lucknow',status:'Active'},{id:'O003',tenantId:'T001',name:'Aliganj',city:'Lucknow',status:'Active'}],
menu:demoMenu.map(x=>({...x})),
orders:[
{id:'ORD-1048',tenantId:'T001',outletId:'O001',items:[{id:'M001',name:'Classic Burger',qty:2,price:249},{id:'M004',name:'Cold Coffee',qty:2,price:149}],subtotal:796,tax:40,total:836,status:'Completed',payment:'Paid',channel:'Dine-in',createdAt:new Date(Date.now()-3600000*2).toISOString()},
{id:'ORD-1047',tenantId:'T001',outletId:'O002',items:[{id:'M002',name:'Margherita Pizza',qty:1,price:349},{id:'M003',name:'Masala Fries',qty:1,price:129}],subtotal:478,tax:24,total:502,status:'Preparing',payment:'Paid',channel:'Takeaway',createdAt:new Date(Date.now()-3600000).toISOString()},
{id:'ORD-1046',tenantId:'T001',outletId:'O001',items:[{id:'M005',name:'Paneer Tikka Wrap',qty:2,price:229}],subtotal:458,tax:23,total:481,status:'New',payment:'Pending',channel:'Dine-in',createdAt:new Date(Date.now()-1800000).toISOString()},
{id:'ORD-1045',tenantId:'T001',outletId:'O003',items:[{id:'M006',name:'Chocolate Brownie',qty:2,price:179}],subtotal:358,tax:18,total:376,status:'Completed',payment:'Paid',channel:'Online',createdAt:new Date(Date.now()-86400000).toISOString()}
],
inventory:[{id:'I001',name:'Burger buns',unit:'pcs',onHand:42,reorder:25,outletId:'O001'},{id:'I002',name:'Mozzarella cheese',unit:'kg',onHand:6.5,reorder:8,outletId:'O001'},{id:'I003',name:'Potatoes',unit:'kg',onHand:18,reorder:10,outletId:'O001'},{id:'I004',name:'Coffee beans',unit:'kg',onHand:2.4,reorder:3,outletId:'O002'},{id:'I005',name:'Paneer',unit:'kg',onHand:4.2,reorder:5,outletId:'O003'}],
expenses:[{id:'E001',category:'Rent',amount:42000,date:today(),outletId:'O001',note:'Monthly rent'},{id:'E002',category:'Utilities',amount:8300,date:today(),outletId:'O001',note:'Power and water'},{id:'E003',category:'Supplies',amount:6200,date:today(),outletId:'O002',note:'Cleaning supplies'}],
actions:[{id:'A001',title:'Review mozzarella stock variance',evidence:'Mozzarella is below the configured reorder level at Hazratganj.',confidence:'High',status:'Suggested',owner:'Demo Owner',target:'Restore stock to 10 kg',baseline:'6.5 kg',due:today()},{id:'A002',title:'Promote top-selling burger combo',evidence:'Classic Burger is among the most frequently ordered menu items in the demo data.',confidence:'Medium',status:'Suggested',owner:'Demo Owner',target:'Measure combo sales for 14 days',baseline:'Current item sales',due:today()}],
members:[{id:'U001',name:'Demo Owner',email:'owner@demo.com',role:'Owner',outlets:'All outlets',status:'Active'}],
subscriptions:[{id:'SUB-001',tenantId:'T001',plan:'Growth',status:'Active',startDate:today(),renewalDate:new Date(Date.now()+86400000*20).toISOString().slice(0,10),amount:4999,scheduledPlan:null}],
trialRequests:[],payments:[],activity:[]
});
let db;
try { db = JSON.parse(localStorage.getItem('rgos_demo_db')||'null') || seed(); } catch(e){ db=seed(); }
function save(){localStorage.setItem('rgos_demo_db',JSON.stringify(db));}
function logActivity(msg){db.activity.unshift({id:uid('EV'),msg,at:new Date().toISOString()});db.activity=db.activity.slice(0,60);save();}
function currentTenant(){return db.tenants.find(t=>t.id===state.user?.tenantId)||db.tenants[0]}
function currentSub(){return db.subscriptions.find(s=>s.tenantId===state.user?.tenantId)||null}
function myOutlets(){return db.outlets.filter(o=>o.tenantId===state.user?.tenantId)}
function activeOutletIds(){const os=myOutlets();return state.outlet==='all'?os.map(o=>o.id):[state.outlet]}
function visibleOrders(){return db.orders.filter(o=>o.tenantId===state.user?.tenantId&&activeOutletIds().includes(o.outletId))}
function toast(msg,type='ok'){const el=document.createElement('div');el.className='toast '+(type==='err'?'err':type==='ok'?'ok':'');el.textContent=msg;$('#toast-root').append(el);setTimeout(()=>el.remove(),3200)}
function modal(title,body,actions=''){ $('#modal-root').innerHTML=`<div class="overlay" data-overlay><div class="modal"><div class="modal-head"><h2>${title}</h2><button class="close" data-close>×</button></div>${body}${actions?`<div class="actions" style="justify-content:flex-end;margin-top:16px">${actions}</div>`:''}</div></div>`; }
function closeModal(){ $('#modal-root').innerHTML='';}
function btn(label,action,cls='btn'){return `<button class="${cls}" data-action="${action}">${label}</button>`}
const navItems=[
['overview','▦','Overview','OVERVIEW'],['pos','＋','POS & Checkout','OPERATIONS'],['orders','☷','Orders'],['menu','▤','Menu & Pricing'],['inventory','▥','Inventory'],['expenses','₹','Expenses'],['reports','▥','Sales Reports'],['growth','✦','Growth Insights'],['outlets','⌂','Outlets'],['team','♙','Team & Roles'],['subscription','◇','Subscription & Plans'],['settings','⚙','Settings']
];
function shell(content){
 const tenant=currentTenant();const isAdmin=state.user?.role==='admin';
 $('#app').innerHTML=`<div class="app"><aside class="sidebar" id="sidebar">
 <div class="brand"><div class="brand-mark">R</div><div><div class="brand-name">Restaurant Growth OS</div><div class="brand-sub">Owner workspace</div></div></div>
 <div class="nav-label">WORKSPACE</div><nav class="nav">${navItems.map(([id,ico,label,group])=>group?`<div class="nav-label">${group}</div><button class="${state.page===id?'active':''}" data-page="${id}"><span class="ico">${ico}</span>${label}</button>`:`<button class="${state.page===id?'active':''}" data-page="${id}"><span class="ico">${ico}</span>${label}</button>`).join('')}
 <div class="nav-label">PLATFORM</div><button class="${state.page==='admin'?'active':''}" data-page="admin"><span class="ico">▦</span>Platform Admin</button>
 </nav><div class="sidebar-bottom"><div class="workspace-card"><strong>${esc(tenant?.name||'Restaurant workspace')}</strong><span>${esc(currentSub()?.plan||tenant?.plan||'Starter')} plan · ${myOutlets().length} outlets</span></div><button class="btn block" style="margin-top:10px" data-action="logout">↪ Sign out</button></div></aside>
 <main class="main"><header class="topbar"><div style="display:flex;align-items:center;gap:10px"><button class="btn mobile-menu" data-action="menuToggle">☰</button><div><div style="font-weight:800">${pageTitle(state.page)}</div><div class="crumb">Restaurant Growth OS <span style="padding:0 5px">/</span>${pageTitle(state.page)}</div></div></div><div class="top-actions"><select class="select outlet-select" id="global-outlet">${myOutlets().map(o=>`<option value="${o.id}" ${state.outlet===o.id?'selected':''}>${esc(o.name)}</option>`).join('')}<option value="all" ${state.outlet==='all'?'selected':''}>All outlets</option></select><button class="btn" data-page="settings" title="Settings">⚙</button><div class="avatar">${esc((state.user?.name||'U').split(' ').map(x=>x[0]).slice(0,2).join(''))}</div></div></header><section class="content">${content}</section></main></div>`;
}
function pageTitle(p){return ({overview:'Business overview',pos:'POS & Checkout',orders:'Orders',menu:'Menu & Pricing',inventory:'Inventory',expenses:'Expenses',reports:'Sales reports',growth:'Growth insights',outlets:'Outlet management',team:'Team & roles',subscription:'Subscription & plans',settings:'Settings',admin:'Platform administration'})[p]||'Restaurant Growth OS'}
function head(title,sub,actions=''){return `<div class="page-head"><div><h1>${title}</h1><p>${sub}</p></div><div class="actions">${actions}</div></div>`}
function kpi(label,value,trend,icon){return `<div class="card"><div class="kpi-icon">${icon}</div><div class="kpi-label">${label}</div><div class="kpi-value">${value}</div><div class="trend">${trend}</div></div>`}
function table(headers,rows){return `<div class="table-wrap"><table><thead><tr>${headers.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>${rows||''}</tbody></table></div>`}
function pill(status){let c=({Active:'green',Paid:'green',Completed:'green',Ready:'green',Approved:'green',Preparing:'blue',New:'amber',Pending:'amber',Suggested:'purple',Rejected:'red',Cancelled:'red',Low:'red',Scheduled:'blue',Expired:'red'})[status]||'blue';return `<span class="pill ${c}">${esc(status)}</span>`}
function orderRow(o){const outlet=db.outlets.find(x=>x.id===o.outletId)?.name||'Outlet';return `<tr><td><strong>${o.id}</strong><div class="item-sub">${new Date(o.createdAt).toLocaleString()}</div></td><td>${esc(outlet)}</td><td>${o.items.length} items</td><td>${money(o.total)}</td><td>${pill(o.status)}</td><td>${pill(o.payment)}</td><td><button class="btn sm" data-action="orderDetail" data-id="${o.id}">View</button></td></tr>`}
function overviewPage(){
 const os=visibleOrders(), completed=os.filter(o=>o.status==='Completed'),sales=completed.reduce((a,o)=>a+o.total,0), count=os.length, avg=count?sales/count:0;
 const totalExpense=db.expenses.filter(e=>activeOutletIds().includes(e.outletId)).reduce((a,e)=>a+e.amount,0);
 const low=db.inventory.filter(i=>activeOutletIds().includes(i.outletId)&&i.onHand<=i.reorder);
 const max=Math.max(1,...db.menu.map(m=>os.reduce((sum,o)=>sum+o.items.filter(it=>it.id===m.id).reduce((s,it)=>s+it.qty,0),0)));
 const bars=db.menu.slice(0,5).map(m=>{let qty=os.reduce((sum,o)=>sum+o.items.filter(it=>it.id===m.id).reduce((s,it)=>s+it.qty,0),0);return `<div class="bar-row"><span>${esc(m.name)}</span><div class="bar-track"><div class="bar-fill" style="width:${qty/max*100}%"></div></div><strong class="right">${qty}</strong></div>`}).join('');
 return `${head('Good afternoon, '+esc(state.user.name.split(' ')[0])+' 👋','Here is what is happening across your restaurant business.',`<button class="btn" data-action="exportSales">⇩ Export report</button><button class="btn primary" data-page="pos">＋ New order</button>`)}
 <div class="grid kpis">${kpi('Recorded sales',money(sales),'+ Based on completed demo orders','₹')}${kpi('Orders',count,`${os.filter(o=>o.status==='New').length} new orders`,'☷')}${kpi('Average order value',money(avg),'Calculated from visible orders','↗')}${kpi('Stock alerts',low.length,low.length?'Review reorder levels':'No low-stock alerts','▥')}</div>
 <div class="grid two"><div class="card"><div class="card-head"><h2>Sales by recent orders</h2><span class="pill blue">Demo data</span></div><div class="bar-list">${['Mon','Tue','Wed','Thu','Fri','Sat','Sun'].map((d,i)=>`<div class="bar-row"><span>${d}</span><div class="bar-track"><div class="bar-fill" style="width:${[44,62,51,76,58,94,70][i]}%"></div></div><strong class="right">${money([4200,5800,4700,7100,5300,8900,6600][i])}</strong></div>`).join('')}</div><p class="small muted" style="margin:15px 0 0">Illustrative trend chart. Replace with API-backed reporting before production.</p></div>
 <div class="card"><div class="card-head"><h2>Needs attention</h2><button class="btn sm" data-page="growth">View insights</button></div>${low.length?low.map(i=>`<div class="insight"><div class="insight-icon">⚠</div><div><strong>${esc(i.name)} is low</strong><p>${i.onHand} ${i.unit} remaining; reorder level is ${i.reorder} ${i.unit}.</p><button class="btn sm" data-action="inventoryAdjust" data-id="${i.id}">Update stock</button></div></div>`).join(''):'<div class="empty"><div class="empty-icon">✓</div><strong>Nothing urgent</strong>Inventory is above configured reorder levels.</div>'}
 <div class="insight"><div class="insight-icon">✦</div><div><strong>Review growth suggestions</strong><p>Turn evidence into an owner-approved action and measure its result.</p><button class="btn sm" data-page="growth">Open growth tracker</button></div></div></div></div>
 <div class="card" style="margin-top:16px"><div class="card-head"><h2>Recent orders</h2><button class="btn sm" data-page="orders">View all orders →</button></div>${table(['Order','Outlet','Items','Total','Status','Payment',''],os.slice(0,5).map(orderRow).join(''))}</div>`;
}
function posPage(){
 const cats=['All',...new Set(db.menu.map(m=>m.category))];const menu=db.menu.filter(m=>m.available&&(state.menuFilter==='All'||m.category===state.menuFilter));
 const subtotal=state.cart.reduce((s,i)=>s+i.price*i.qty,0),tax=Math.round(subtotal*.05),total=subtotal+tax;
 return `${head('POS & Checkout','Create an order, calculate totals and simulate payment.','<button class="btn" data-action="clearCart">Clear cart</button>')}
 <div class="pos-layout"><div class="card"><div class="filters">${cats.map(c=>`<button class="btn sm ${state.menuFilter===c?'primary':''}" data-action="posCategory" data-value="${esc(c)}">${esc(c)}</button>`).join('')}</div><div class="menu-grid">${menu.map(m=>`<div class="product-card"><div class="product-emoji">${m.emoji}</div><div><strong>${esc(m.name)}</strong><div class="item-sub">${esc(m.category)}</div></div><div style="display:flex;align-items:center;justify-content:space-between"><strong>${money(m.price)}</strong><button class="btn primary sm" data-action="addCart" data-id="${m.id}">＋ Add</button></div></div>`).join('')||'<div class="empty">No available items in this category.</div>'}</div></div>
 <div class="card"><div class="card-head"><h2>Current order</h2><span class="pill blue">${state.cart.reduce((s,i)=>s+i.qty,0)} items</span></div><div class="field"><label>Order type</label><select id="pos-channel"><option>Dine-in</option><option>Takeaway</option><option>Online</option></select></div><div class="field"><label>Outlet</label><select id="pos-outlet">${myOutlets().map(o=>`<option value="${o.id}" ${state.outlet===o.id?'selected':''}>${esc(o.name)}</option>`).join('')}</select></div>
 ${state.cart.length?state.cart.map(i=>`<div class="cart-line"><div style="flex:1"><strong>${esc(i.name)}</strong><div class="item-sub">${money(i.price)} each</div></div><div class="qty"><button data-action="qtyDown" data-id="${i.id}">−</button><strong>${i.qty}</strong><button data-action="qtyUp" data-id="${i.id}">+</button></div><strong>${money(i.qty*i.price)}</strong></div>`).join(''):'<div class="empty"><div class="empty-icon">🛒</div><strong>Your cart is empty</strong>Add menu items to begin an order.</div>'}
 <div style="margin-top:15px"><div class="totals"><span>Subtotal</span><strong>${money(subtotal)}</strong></div><div class="totals"><span>Demo tax (5%)</span><strong>${money(tax)}</strong></div><div class="totals total"><span>Total</span><strong>${money(total)}</strong></div></div><button class="btn primary block" style="margin-top:12px" data-action="checkout" ${!state.cart.length?'disabled':''}>Proceed to payment · ${money(total)}</button><p class="tiny muted" style="margin:10px 0 0">Payment is simulated; no real money is charged.</p></div></div>`;
}

function inventoryPage(){
 const items=db.inventory.filter(i=>activeOutletIds().includes(i.outletId));

function reportsPage(){

 const itemCounts=db.menu.map(m=>({m,qty:os.reduce((s,o)=>s+o.items.filter(i=>i.id===m.id).reduce((x,i)=>x+i.qty,0),0)})).sort((a,b)=>b.qty-a.qty);
 return `${head('Sales reports','Explore recorded orders, sales, refunds and menu performance.','<button class="btn" data-action="exportSales">⇩ Export CSV</button>')}
 <div class="filters"><label class="small muted">Period</label><select class="select" id="report-range"><option value="7" ${state.reportRange==='7'?'selected':''}>Last 7 days</option><option value="30" ${state.reportRange==='30'?'selected':''}>Last 30 days</option><option value="all" ${state.reportRange==='all'?'selected':''}>All demo records</option></select><span class="pill blue">Recorded demo transactions</span></div>

function render(){
 if(!state.user){renderAuth();return}
 let html='';
 switch(state.page){
 case'overview':html=overviewPage();break;case'pos':html=posPage();break;case'orders':html=ordersPage();break;case'menu':html=menuPage();break;case'inventory':html=inventoryPage();break;case'expenses':html=expensesPage();break;case'reports':html=reportsPage();break;case'growth':html=growthPage();break;case'outlets':html=outletsPage();break;case'team':html=teamPage();break;case'subscription':html=subscriptionPage();break;case'settings':html=settingsPage();break;case'admin':html=adminPage();break;default:state.page='overview';html=overviewPage()
 }
 shell(html);
}

function createPaymentRecord(tenantId,planName,amount,method,desc){
 const p={id:uid('PAY'),tenantId,plan:planName,amount,date:today(),method,status:'Paid (demo)',description:desc,reference:uid('REF')};db.payments.unshift(p);save();return p;
}
function finishSignupPayment(){
 const pending=state.pendingSignup;if(!pending){toast('Signup session expired. Please start again.','err');state.page='signup';render();return}
 const p=plans.find(x=>x.name===state.selectedPlan)||plans[1],tenantId=uid('TEN'),userId=uid('U'),outletId=uid('OUT');
 const tenant={id:tenantId,name:pending.business,city:pending.city||'India',plan:p.name,status:'Active',createdAt:today()};
 db.tenants.push(tenant);db.users.push({id:userId,name:pending.name,email:pending.email,password:pending.password,role:'owner',verified:true,tenantId});
 db.outlets.push({id:outletId,tenantId,name:pending.outlet||'Main outlet',city:pending.city||'India',status:'Active'});
 db.subscriptions.push({id:uid('SUB'),tenantId,plan:p.name,status:'Active',startDate:today(),renewalDate:new Date(Date.now()+86400000*30).toISOString().slice(0,10),amount:p.price,scheduledPlan:null});
 createPaymentRecord(tenantId,p.name,p.price+Math.round(p.price*.18),$('#payment-form [name=method]')?.value||'UPI','Initial '+p.name+' subscription (demo)');
 save();state.user=db.users.find(u=>u.id===userId);state.outlet='all';state.page='overview';state.cart=[];state.pendingSignup=null;logActivity('New demo tenant signed up: '+tenant.name);toast('Demo payment successful. Workspace created!');render();
}

document.addEventListener('click',e=>{
 const auth=e.target.closest('[data-auth]');if(auth){e.preventDefault();state.page=auth.dataset.auth;render();return}
 const nav=e.target.closest('[data-page]');if(nav){state.page=nav.dataset.page;$('#sidebar')?.classList.remove('open');render();return}
 const close=e.target.closest('[data-close]');if(close){closeModal();return}
 if(e.target.matches('[data-overlay]')){closeModal();return}
 const b=e.target.closest('[data-action]');if(!b)return;
 const a=b.dataset.action,id=b.dataset.id,val=b.dataset.value;
 switch(a){
 case'logout':state.user=null;state.page='login';state.cart=[];render();break;
 case'menuToggle':$('#sidebar')?.classList.toggle('open');break;
 case'selectPlan':state.selectedPlan=val;render();break;
 case'goPayment':state.page='payment';showPayment('signup');break;
 case'paymentFail':toast('Demo payment failed. No charge was made. You can retry.','err');break;
 case'addCart':{const m=db.menu.find(x=>x.id===id);if(m){const it=state.cart.find(x=>x.id===id);it?it.qty++:state.cart.push({id:m.id,name:m.name,price:m.price,qty:1});render()}break}
 case'qtyUp':{const it=state.cart.find(x=>x.id===id);if(it)it.qty++;render();break}
 case'qtyDown':{const it=state.cart.find(x=>x.id===id);if(it){it.qty--;if(it.qty<=0)state.cart=state.cart.filter(x=>x.id!==id)}render();break}
 case'clearCart':state.cart=[];render();break;
 case'checkout':{if(!state.cart.length)return;const sub=state.cart.reduce((s,i)=>s+i.price*i.qty,0),tax=Math.round(sub*.05),total=sub+tax,channel=$('#pos-channel')?.value||'Dine-in',outletId=$('#pos-outlet')?.value||myOutlets()[0]?.id;
 modal('Simulated payment',`<div class="notice">No real payment is processed. Completing this demo will create an order in local browser data.</div><div class="totals"><span>Subtotal</span><strong>${money(sub)}</strong></div><div class="totals"><span>Demo tax</span><strong>${money(tax)}</strong></div><div class="totals total"><span>Total due</span><strong>${money(total)}</strong></div><div class="field" style="margin-top:14px"><label>Payment method</label><select id="pos-payment-method"><option>UPI</option><option>Card</option><option>Cash</option><option>Net banking</option></select></div>`,`<button class="btn" data-close>Cancel</button><button class="btn primary" data-action="completeOrder">Confirm demo payment</button>`);state.checkout={sub,tax,total,channel,outletId};break}
 case'completeOrder':{const c=state.checkout;if(!c)return;const o={id:uid('ORD'),tenantId:state.user.tenantId,outletId:c.outletId,items:state.cart.map(i=>({...i})),subtotal:c.sub,tax:c.tax,total:c.total,status:'New',payment:'Paid (demo)',channel:c.channel,createdAt:new Date().toISOString()};db.orders.unshift(o);logActivity('Created demo POS order '+o.id);state.cart=[];closeModal();state.page='orders';toast('Order '+o.id+' created. Payment marked demo-paid.');render();break}
 case'orderDetail':{const o=db.orders.find(x=>x.id===id);if(!o)return;modal('Order '+o.id,`<div class="grid two"><div><div class="small muted">Outlet</div><strong>${esc(db.outlets.find(x=>x.id===o.outletId)?.name||'')}</strong></div><div><div class="small muted">Order status</div>${pill(o.status)}</div></div><h3 style="margin-top:18px">Items</h3>${o.items.map(i=>`<div class="totals"><span>${esc(i.name)} × ${i.qty}</span><strong>${money(i.price*i.qty)}</strong></div>`).join('')}<div class="totals"><span>Subtotal</span><strong>${money(o.subtotal)}</strong></div><div class="totals"><span>Demo tax</span><strong>${money(o.tax)}</strong></div><div class="totals total"><span>Total</span><strong>${money(o.total)}</strong></div><div style="margin-top:14px"><label class="small">Update order status</label><select class="select" id="order-status-change">${['New','Preparing','Ready','Completed','Cancelled'].map(s=>`<option ${s===o.status?'selected':''}>${s}</option>`).join('')}</select></div><p class="small muted" style="margin-top:12px">Payment: ${esc(o.payment)} · Channel: ${esc(o.channel)}</p>`,`<button class="btn" data-close>Close</button><button class="btn primary" data-action="saveOrderStatus" data-id="${o.id}">Save status</button>`);break}
 case'saveOrderStatus':{const o=db.orders.find(x=>x.id===id);if(o){o.status=$('#order-status-change').value;logActivity('Updated order '+id+' to '+o.status);save();closeModal();toast('Order status updated');render()}break}
 case'posCategory':state.menuFilter=val;render();break;
 case'addMenu':menuForm();break;case'editMenu':menuForm(id);break;
 case'toggleMenu':{const m=db.menu.find(x=>x.id===id);if(m){m.available=!m.available;save();toast('Menu availability updated');render()}break}
 case'addInventory':inventoryForm();break;case'inventoryAdjust':inventoryForm(id);break;
 case'addExpense':expenseForm();break;
 case'deleteExpense':db.expenses=db.expenses.filter(x=>x.id!==id);save();toast('Expense removed from demo data');render();break;
 case'approveAction':{const x=db.actions.find(x=>x.id===id);if(x){x.status='Approved';logActivity('Approved growth action '+x.title);save();toast('Action approved');render()}break}
 case'rejectAction':{const x=db.actions.find(x=>x.id===id);if(x){x.status='Rejected';save();toast('Suggestion rejected');render()}break}
 case'progressAction':{const x=db.actions.find(x=>x.id===id);if(x){x.status='In progress';save();toast('Action marked in progress');render()}break}
 case'completeAction':growthOutcomeForm(id);break;case'editAction':growthForm(id);break;case'addGrowth':growthForm();break;
 case'addOutlet':outletForm();break;case'editOutlet':outletForm(id);break;case'switchOutlet':state.outlet=id;state.page='overview';render();toast('Outlet view changed');break;
 case'inviteMember':memberForm();break;case'editMember':memberForm(id);break;
 case'changePlan':{const sub=currentSub(),target=plans.find(p=>p.name===val);if(!sub||!target)return;if(target.price<sub.amount){modal('Schedule downgrade',`<div class="notice warn">Your current plan remains active until the renewal date. The downgrade will take effect on ${dateFmt(sub.renewalDate)}.</div><p>Current plan: <strong>${sub.plan}</strong> (${money(sub.amount)}/month)</p><p>New plan: <strong>${target.name}</strong> (${money(target.price)}/month)</p><p class="small muted">If current outlet or feature usage exceeds the target plan, access handling must be decided before production.</p>`,`<button class="btn" data-close>Cancel</button><button class="btn primary" data-action="confirmDowngrade" data-value="${target.name}">Schedule for renewal</button>`)}else{const remaining=20/30,credit=Math.round(sub.amount*remaining),due=Math.max(0,target.price-credit);modal('Upgrade plan',`<div class="notice">Demo proration: estimated unused credit from the current plan is deducted from the new plan charge. This example assumes 20 days remain in a 30-day cycle.</div><div class="totals"><span>New plan</span><strong>${target.name}</strong></div><div class="totals"><span>New plan monthly amount</span><strong>${money(target.price)}</strong></div><div class="totals"><span>Estimated unused current-plan credit</span><strong>−${money(credit)}</strong></div><div class="totals total"><span>Simulated amount due now</span><strong>${money(due)}</strong></div><div class="small muted">Illustrative only; final proration, taxes, currency and gateway rules require approval.</div>`,`<button class="btn" data-close>Cancel</button><button class="btn primary" data-action="confirmUpgrade" data-value="${target.name}">Continue to demo payment</button>`);state.pendingUpgrade={target,credit,due}}break}
 case'confirmDowngrade':{const sub=currentSub();if(sub){sub.scheduledPlan=val;logActivity('Scheduled plan downgrade to '+val);save();closeModal();toast('Downgrade scheduled for renewal');render()}break}
 case'cancelDowngrade':{const sub=currentSub();if(sub){sub.scheduledPlan=null;save();toast('Scheduled downgrade cancelled');render()}break}

 case'completeUpgrade':{const p=state.pendingUpgrade,sub=currentSub();if(p&&sub){createPaymentRecord(state.user.tenantId,p.target.name,p.due,$('#upgrade-method')?.value||'UPI','Prorated upgrade to '+p.target.name);sub.plan=p.target.name;sub.amount=p.target.price;sub.scheduledPlan=null;currentTenant().plan=p.target.name;logActivity('Upgraded subscription to '+p.target.name);save();state.pendingUpgrade=null;closeModal();toast('Demo upgrade successful');render()}break}

 case'rejectTrial':{const t=db.trialRequests.find(x=>x.id===id);if(t){t.status='Rejected';t.decidedAt=today();save();toast('Trial request rejected');render()}break}

 if(e.target.id==='order-search'){const pos=e.target.selectionStart;state.orderSearch=e.target.value;const box=e.target;const y=window.scrollY;render();const n=$('#order-search');if(n){n.focus();n.setSelectionRange(pos,pos);window.scrollTo(0,y)}}
 if(e.target.id==='menu-search'){const pos=e.target.selectionStart;state.menuSearch=e.target.value;const y=window.scrollY;render();const n=$('#menu-search');if(n){n.focus();n.setSelectionRange(pos,pos);window.scrollTo(0,y)}}

document.addEventListener('submit',e=>{
 const f=e.target;if(!f.id)return;e.preventDefault();const d=Object.fromEntries(new FormData(f).entries());
 if(f.id==='login-form'){
  const u=db.users.find(u=>u.email.toLowerCase()===String(d.email).toLowerCase()&&u.password===d.password);
  if(!u){toast('Email or password is incorrect. Try the demo credentials.','err');return}
  state.user=u;state.page='overview';state.outlet='all';logActivity('Signed in: '+u.email);toast('Welcome back, '+u.name);render();
 }else if(f.id==='signup-form'){
  if(db.users.some(u=>u.email.toLowerCase()===d.email.toLowerCase())){toast('This email is already registered in demo data.','err');return}
  state.pendingSignup={name:d.name,business:d.business,email:d.email,password:d.password};state.page='verify';render();
 }else if(f.id==='verify-form'){
  if(d.code!=='123456'){toast('Incorrect demo code. Use 123456.','err');return}
  state.page='onboarding';render();
 }else if(f.id==='onboarding-form'){
  state.pendingSignup={...state.pendingSignup,business:d.business,city:d.city,outlet:d.outlet,type:d.type};state.selectedPlan='Growth';state.page='plans';render();
 }else if(f.id==='payment-form'){
  if(state.user&&state.page==='payment'&&!state.pendingSignup){toast('Payment simulation complete.');return}
  finishSignupPayment();
 }else if(f.id==='forgot-form'){toast('If this account exists, a reset link would be sent. (Demo only)');state.page='login';render()}
 else if(f.id==='profile-form'){currentTenant().name=d.name;currentTenant().city=d.city;state.user.name=d.owner;save();toast('Profile saved');render()}
 else if(f.id==='menu-form'){
  const id=f.dataset.id;const item={id:id||uid('M'),name:d.name,category:d.category,price:Number(d.price),emoji:d.emoji||'🍽️',available:d.available==='on'};
  if(id){db.menu[db.menu.findIndex(m=>m.id===id)]=item}else db.menu.push(item);save();closeModal();toast('Menu item saved');render()
 }else if(f.id==='inventory-form'){
  const id=f.dataset.id;const item={id:id||uid('I'),name:d.name,unit:d.unit,onHand:Number(d.onHand),reorder:Number(d.reorder),outletId:d.outletId};
  if(id){db.inventory[db.inventory.findIndex(i=>i.id===id)]=item}else db.inventory.push(item);logActivity('Updated stock for '+item.name);save();closeModal();toast('Inventory saved');render()
 }else if(f.id==='expense-form'){
  db.expenses.unshift({id:uid('E'),category:d.category,amount:Number(d.amount),date:d.date,outletId:d.outletId,note:d.note});save();closeModal();toast('Expense recorded');render()
 }else if(f.id==='growth-form'){
  const id=f.dataset.id;const item={id:id||uid('A'),title:d.title,evidence:d.evidence,confidence:d.confidence,status:id?(db.actions.find(a=>a.id===id)?.status||'Suggested'):'Suggested',owner:d.owner,target:d.target,baseline:d.baseline,due:d.due};
  if(id){db.actions[db.actions.findIndex(a=>a.id===id)]=item}else db.actions.unshift(item);save();closeModal();toast('Growth action saved');render()
 }else if(f.id==='outlet-form'){
  const id=f.dataset.id;const item={id:id||uid('OUT'),tenantId:state.user.tenantId,name:d.name,city:d.city,status:d.status};
  if(id){db.outlets[db.outlets.findIndex(o=>o.id===id)]=item}else db.outlets.push(item);save();closeModal();toast('Outlet saved');render()
 }else if(f.id==='member-form'){
  const id=f.dataset.id;const item={id:id||uid('U'),name:d.name,email:d.email,role:d.role,outlets:d.outlets,status:d.status};
  if(id){db.members[db.members.findIndex(m=>m.id===id)]=item}else db.members.push(item);save();closeModal();toast('Team member saved in demo');render()
 }else if(f.id==='trial-form'){
  db.trialRequests.unshift({id:uid('TR'),tenantId:state.user.tenantId,business:currentTenant().name,email:state.user.email,status:'Pending',createdAt:today(),reason:d.reason});save();closeModal();toast('Business trial request submitted');render()
 }else if(f.id==='growth-outcome-form'){
  const x=db.actions.find(a=>a.id===f.dataset.id);if(x){x.status='Completed';x.outcome=d.outcome;x.result=d.result;x.completedAt=today();save();closeModal();toast('Outcome recorded');render()}
 }
});
function menuForm(id){const m=id?db.menu.find(x=>x.id===id):{name:'',category:'Mains',price:'',emoji:'🍽️',available:true};modal(id?'Edit menu item':'Add menu item',`<form id="menu-form" data-id="${id||''}"><div class="form-grid"><div class="field"><label>Item name</label><input name="name" required value="${esc(m.name)}"></div><div class="field"><label>Category</label><select name="category">${['Mains','Sides','Beverages','Desserts','Starters'].map(c=>`<option ${m.category===c?'selected':''}>${c}</option>`).join('')}</select></div><div class="field"><label>Price (INR)</label><input name="price" type="number" min="0" step="1" required value="${m.price}"></div><div class="field"><label>Emoji / icon</label><input name="emoji" value="${esc(m.emoji)}"></div><div class="field full"><label><input type="checkbox" name="available" ${m.available?'checked':''}> Available for POS</label></div></div><button class="btn primary">Save menu item</button></form>`)}
function inventoryForm(id){const i=id?db.inventory.find(x=>x.id===id):{name:'',unit:'kg',onHand:0,reorder:0,outletId:myOutlets()[0]?.id};modal(id?'Adjust inventory count':'Add inventory item',`<form id="inventory-form" data-id="${id||''}"><div class="field"><label>Ingredient</label><input name="name" required value="${esc(i.name)}"></div><div class="form-grid"><div class="field"><label>Unit</label><select name="unit">${['pcs','kg','g','L','ml','pack'].map(u=>`<option ${i.unit===u?'selected':''}>${u}</option>`).join('')}</select></div><div class="field"><label>Current physical count</label><input name="onHand" type="number" min="0" step="0.01" required value="${i.onHand}"></div><div class="field"><label>Reorder level</label><input name="reorder" type="number" min="0" step="0.01" required value="${i.reorder}"></div><div class="field"><label>Outlet</label><select name="outletId">${myOutlets().map(o=>`<option value="${o.id}" ${o.id===i.outletId?'selected':''}>${esc(o.name)}</option>`).join('')}</select></div></div><button class="btn primary">Save physical count</button></form>`)}
function expenseForm(){modal('Add expense',`<form id="expense-form"><div class="form-grid"><div class="field"><label>Category</label><select name="category">${['Rent','Payroll','Utilities','Supplies','Delivery commission','Marketing','Maintenance','Other'].map(c=>`<option>${c}</option>`).join('')}</select></div><div class="field"><label>Amount (INR)</label><input name="amount" type="number" min="0" required></div><div class="field"><label>Date</label><input name="date" type="date" value="${today()}" required></div><div class="field"><label>Outlet</label><select name="outletId">${myOutlets().map(o=>`<option value="${o.id}">${esc(o.name)}</option>`).join('')}</select></div><div class="field full"><label>Note</label><input name="note" placeholder="What was this expense for?"></div></div><button class="btn primary">Save expense</button></form>`)}
function growthForm(id){const a=id?db.actions.find(x=>x.id===id):{title:'',evidence:'',confidence:'Medium',owner:state.user.name,target:'',baseline:'',due:today()};modal(id?'Edit growth action':'Create manual growth action',`<form id="growth-form" data-id="${id||''}"><div class="field"><label>Action title</label><input name="title" required value="${esc(a.title)}"></div><div class="field"><label>Evidence / rationale</label><textarea name="evidence" required rows="3">${esc(a.evidence)}</textarea></div><div class="form-grid"><div class="field"><label>Confidence</label><select name="confidence">${['High','Medium','Low'].map(c=>`<option ${a.confidence===c?'selected':''}>${c}</option>`).join('')}</select></div><div class="field"><label>Owner</label><input name="owner" value="${esc(a.owner)}"></div><div class="field"><label>Baseline</label><input name="baseline" value="${esc(a.baseline)}"></div><div class="field"><label>Target</label><input name="target" value="${esc(a.target)}"></div><div class="field full"><label>Due date</label><input type="date" name="due" value="${a.due||today()}"></div></div><button class="btn primary">Save action</button></form>`)}
function growthOutcomeForm(id){const a=db.actions.find(x=>x.id===id);modal('Record action outcome',`<p class="muted">Action: ${esc(a?.title)}</p><form id="growth-outcome-form" data-id="${id}"><div class="field"><label>Observed result</label><input name="result" required placeholder="e.g. Stock restored to 10 kg"></div><div class="field"><label>Outcome notes</label><textarea name="outcome" rows="3" required placeholder="What changed versus baseline?"></textarea></div><button class="btn success">Save outcome and complete</button></form>`)}
function outletForm(id){const o=id?db.outlets.find(x=>x.id===id):{name:'',city:currentTenant().city,status:'Active'};modal(id?'Edit outlet':'Add outlet',`<form id="outlet-form" data-id="${id||''}"><div class="field"><label>Outlet name</label><input name="name" required value="${esc(o.name)}"></div><div class="field"><label>City</label><input name="city" required value="${esc(o.city)}"></div><div class="field"><label>Status</label><select name="status"><option ${o.status==='Active'?'selected':''}>Active</option><option ${o.status==='Inactive'?'selected':''}>Inactive</option></select></div><button class="btn primary">Save outlet</button></form>`)}
function memberForm(id){const m=id?db.members.find(x=>x.id===id):{name:'',email:'',role:'Cashier',outlets:'All outlets',status:'Invited'};modal(id?'Edit team member':'Invite team member (demo)',`<form id="member-form" data-id="${id||''}"><div class="form-grid"><div class="field"><label>Full name</label><input name="name" required value="${esc(m.name)}"></div><div class="field"><label>Email</label><input name="email" type="email" required value="${esc(m.email)}"></div><div class="field"><label>Role</label><select name="role">${['Owner','Manager','Cashier','Kitchen','Inventory Manager','Accountant'].map(r=>`<option ${m.role===r?'selected':''}>${r}</option>`).join('')}</select></div><div class="field"><label>Outlet scope</label><select name="outlets"><option>All outlets</option>${myOutlets().map(o=>`<option ${m.outlets===o.name?'selected':''}>${esc(o.name)}</option>`).join('')}</select></div><div class="field full"><label>Status</label><select name="status">${['Active','Invited','Disabled'].map(s=>`<option ${m.status===s?'selected':''}>${s}</option>`).join('')}</select></div></div><button class="btn primary">Save team member</button></form>`)}
function trialRequestForm(){const old=db.trialRequests.find(t=>t.tenantId===state.user.tenantId&&t.status==='Pending');if(old){toast('A trial request is already pending.','err');return}modal('Request Business plan trial',`<div class="notice">The request will be reviewed by the platform admin in this demo. It does not grant Business features until approved.</div><form id="trial-form"><div class="field"><label>Reason for trial</label><textarea name="reason" required rows="3" placeholder="Tell us about your outlets and what you need to evaluate."></textarea></div><button class="btn primary">Submit trial request</button></form>`)}
function exportCsv(){const os=visibleOrders();const rows=[['Order ID','Date','Outlet','Status','Payment','Channel','Subtotal','Tax','Total'],...os.map(o=>[o.id,o.createdAt,db.outlets.find(x=>x.id===o.outletId)?.name||'',o.status,o.payment,o.channel,o.subtotal,o.tax,o.total])];const csv=rows.map(r=>r.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(',')).join('\r\n');const blob=new Blob([csv],{type:'text/csv;charset=utf-8;'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='restaurant-growth-os-orders.csv';a.click();URL.revokeObjectURL(url);toast('CSV export generated')}
function setupAuthForms(){ /* document-level submit handler handles auth forms */ }
function boot(){save();state.page='login';render()}
boot();
})();
